<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Chat streaming con Ollama</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; }
        #chat { border: 1px solid #ccc; padding: 1rem; height: 400px; overflow-y: auto; }
        .message { margin-bottom: 1rem; }
        .user { font-weight: bold; }
        .bot { color: blue; }
        #inputForm { margin-top: 1rem; }
    </style>
</head>
<body>
    <h1>Chat streaming con Ollama</h1>
    <div id="chat"></div>

    <form id="inputForm">
        <input type="text" id="msgInput" placeholder="Escribe tu mensaje..." autocomplete="off" style="width: 80%;" />
        <button type="submit">Enviar</button>
    </form>

    <script>
    async function streamMessage(content) {
        const resp = await fetch('/chat-stream', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content })
        });
        return resp.body.getReader();
    }

    document.getElementById('inputForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const input = document.getElementById('msgInput');
        const text = input.value.trim();
        if (!text) return;

        const chat = document.getElementById('chat');
        const userDiv = document.createElement('div');
        userDiv.className = 'message user';
        userDiv.textContent = text;
        chat.appendChild(userDiv);
        chat.scrollTop = chat.scrollHeight;
        input.value = '';

        // start streaming response
        const botDiv = document.createElement('div');
        botDiv.className = 'message bot';
        chat.appendChild(botDiv);

        const reader = await streamMessage(text);
        const decoder = new TextDecoder();
        let partial = '';
        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            partial += decoder.decode(value, { stream: true });
            // split by lines
            const lines = partial.split('\n');
            partial = lines.pop();
            for (const line of lines) {
                if (line.trim()) {
                    botDiv.textContent += line + '\n';
                    chat.scrollTop = chat.scrollHeight;
                }
            }
        }
        if (partial.trim()) {
            botDiv.textContent += partial;
            chat.scrollTop = chat.scrollHeight;
        }
    });
    </script>
</body>
</html>
